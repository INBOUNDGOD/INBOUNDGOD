<title>Be My Crush?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a step switcher on top, then one centred "game card" per screen (ask, their page, your result).
   Single bright candy look on purpose; every colour is set explicitly so it reads the same on any host theme. */
:root {
  --bg: #ffe1ea;
  --bg-dot: #ffc9d8;
  --card: #fffaf6;
  --ink: #3b1f2b;
  --ink-soft: #7d5566;
  --berry: #ff3d6e;
  --berry-deep: #d81e52;
  --sun: #ffcf3f;
  --mint: #4fcfa3;
  --line: #f4b8c9;
  --display: "Grandstander", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 2px, transparent 2.5px);
  background-size: 26px 26px;
  color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  min-height: 100vh;
}
.wrap { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 48px; display: grid; gap: 18px; }

.demo-bar { display: grid; gap: 10px; justify-items: center; text-align: center; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.steps button { font: 800 14px var(--body); color: var(--ink-soft); background: transparent; border: 2px solid transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.steps button[aria-current="true"] { color: var(--ink); background: var(--card); border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.steps button:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible, .swatch:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.card {
  position: relative; background: var(--card); border: 3px solid var(--ink); border-radius: 28px;
  box-shadow: 0 8px 0 var(--ink); padding: 26px 22px 28px; display: grid; gap: 16px; justify-items: center; text-align: center;
  overflow: hidden; min-width: 0;
}
.card h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 7vw, 38px); line-height: 1.05; margin: 0; text-wrap: balance; }
.card h1 .name { color: var(--berry); }
.card p { margin: 0; color: var(--ink-soft); max-width: 36ch; }
.kicker { font: 800 13px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--berry-deep); }

.char { position: relative; width: 150px; height: 150px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; z-index: 2; }
.char.held { cursor: grabbing; }
.char .squish { transform-origin: 50% 95%; }
.char.poked .squish { animation: squish .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes squish { 0% { transform: scale(1,1); } 30% { transform: scale(1.18,.82); } 60% { transform: scale(.92,1.1); } 100% { transform: scale(1,1); } }
.pop { position: absolute; left: 50%; top: 10%; width: 26px; height: 26px; margin-left: -13px; pointer-events: none; animation: pop 1s ease-out forwards; }
@keyframes pop { from { transform: translate(0,0) scale(.4); opacity: 1; } to { transform: translate(var(--dx, 0px), -70px) scale(1.2); opacity: 0; } }
.char svg { width: 100%; height: 100%; overflow: visible; }
.bob { animation: bob 1.8s ease-in-out infinite; transform-origin: 50% 90%; }
.dance { animation: dance .5s ease-in-out infinite alternate; transform-origin: 50% 90%; }
.droop { animation: droop 2.6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes bob { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-10px) scale(.97,1.03); } }
@keyframes dance { from { transform: rotate(-8deg) translateY(0); } to { transform: rotate(8deg) translateY(-14px); } }
@keyframes droop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px) scale(1.02,.98); } }
.eye { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%,94%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }

.bubble { position: relative; background: #fff; border: 3px solid var(--ink); border-radius: 20px; padding: 12px 16px; font: 700 17px var(--body); max-width: 34ch; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; width: 18px; height: 18px; background: #fff; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
.note { font-family: var(--display); font-weight: 600; font-size: 18px; color: var(--ink); background: #fff7d6; border: 2px solid var(--sun); border-radius: 14px; padding: 10px 14px; max-width: 34ch; transform: rotate(-1.5deg); }

.form { display: grid; gap: 12px; width: 100%; text-align: left; }
.field { display: grid; gap: 4px; }
.field label { font: 800 14px var(--body); }
.field input, .field textarea { font: 600 16px var(--body); color: var(--ink); background: #fff; border: 2.5px solid var(--ink); border-radius: 14px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
.field textarea { resize: vertical; min-height: 64px; }
.hint { font-size: 13px; color: var(--ink-soft); }
.swatches { display: flex; gap: 10px; }
.swatch { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--ink); cursor: pointer; padding: 0; }
.swatch[aria-checked="true"] { box-shadow: 0 0 0 3px var(--card), 0 0 0 6px var(--ink); }

.btn { font: 800 18px var(--body); color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 12px 26px; box-shadow: 0 5px 0 var(--ink); cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--berry); color: #fff; }
.btn.small { font-size: 15px; padding: 8px 18px; box-shadow: 0 4px 0 var(--ink); }

.answers { position: relative; width: 100%; height: 180px; }
#yesBtn { position: absolute; left: 22%; top: 40px; transform-origin: center; transition: transform .25s cubic-bezier(.3,1.6,.5,1); background: var(--mint); }
#noBtn { position: absolute; left: 58%; top: 46px; transition: left .25s ease, top .25s ease; }
.tease { min-height: 1.5em; font: 800 15px var(--body); color: var(--berry-deep); }

.linkbox { display: flex; gap: 8px; width: 100%; align-items: center; background: #fff; border: 2.5px dashed var(--ink); border-radius: 16px; padding: 8px 8px 8px 14px; box-sizing: border-box; }
.linkbox code { flex: 1; min-width: 0; font: 700 15px ui-monospace, monospace; overflow-wrap: anywhere; text-align: left; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { font: 800 13px var(--body); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; background: #fff; color: var(--ink-soft); }
.chip.done { background: var(--mint); color: var(--ink); }
.chip.yes { background: var(--sun); color: var(--ink); }
.chip.no { background: var(--line); color: var(--ink); }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
@media (prefers-reduced-motion: reduce) {
  .bob, .dance, .droop, .eye, .pulse, .char.poked .squish, .pop { animation: none; }
  .pop { display: none; }
  #yesBtn, #noBtn { transition: none; }
}
</style>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="demo-bar">
    <nav class="steps" aria-label="Demo screens">
      <button type="button" data-go="ask" aria-current="true">1 · Ask</button>
      <button type="button" data-go="crush" aria-current="false">2 · Their page</button>
      <button type="button" data-go="result" aria-current="false">3 · Answer</button>
    </nav>
  </div>

  <!-- 1. Asker makes the request -->
  <section class="card" id="view-ask" aria-labelledby="askTitle">
    <div class="char" id="askChar"></div>
    <p class="hint" style="margin-top:-8px">Psst, you can poke me or drag me around.</p>
    <h1 id="askTitle">Ask your crush</h1>
    <p>Fill this in and you'll get a secret link to send them. Only you can see their answer.</p>
    <form class="form" id="askForm" novalidate>
      <div class="field"><label for="fromName">Your name</label><input id="fromName" maxlength="24" autocomplete="off" value="Sam"></div>
      <div class="field"><label for="toName">Their name</label><input id="toName" maxlength="24" autocomplete="off" value="Alex"></div>
      <div class="field"><label for="note">A little note <span class="hint">(optional)</span></label><textarea id="note" maxlength="140">I like it when you laugh at my terrible jokes.</textarea></div>
      <div class="field"><span id="colourLabel" style="font:800 14px var(--body)">Pick your little messenger</span>
        <div class="swatches" role="radiogroup" aria-labelledby="colourLabel" id="swatches"></div>
      </div>
      <p class="tease" id="askError" role="alert"></p>
      <div style="display:grid;justify-items:center"><button class="btn primary" type="submit">Make my link</button></div>
    </form>
    <div id="linkPanel" hidden style="display:grid;gap:12px;justify-items:center;width:100%">
      <p class="kicker">Your secret link is ready</p>
      <div class="linkbox"><code id="linkText">your-site/c/7KQ2</code><button class="btn small" type="button" id="copyBtn">Copy</button></div>
      <p class="hint">In the real site, you'd send this to them and keep your own result link.</p>
      <button class="btn primary" type="button" data-go="crush">See their page →</button>
    </div>
  </section>

  <!-- 2. The crush answers -->
  <section class="card" id="view-crush" hidden aria-labelledby="crushTitle">
    <p class="kicker" id="crushKicker"></p>
    <div class="bubble" id="crushBubble"></div>
    <div class="char" id="crushChar"></div>
    <h1 id="crushTitle"></h1>
    <div class="note" id="crushNote" hidden></div>
    <div id="askPanel" style="display:grid;gap:6px;width:100%">
      <div class="answers" id="answers">
        <button class="btn" type="button" id="yesBtn">Yes!</button>
        <button class="btn" type="button" id="noBtn">No</button>
      </div>
      <p class="tease" id="tease" aria-live="polite"></p>
    </div>
    <div id="afterPanel" hidden style="display:grid;gap:12px;justify-items:center">
      <p id="afterText"></p>
      <button class="btn small" type="button" data-go="result" id="seeSide"></button>
    </div>
  </section>

  <!-- 3. Asker sees the answer -->
  <section class="card" id="view-result" hidden aria-labelledby="resultTitle">
    <div class="chips" id="chips"></div>
    <div class="char" id="resultChar"></div>
    <h1 id="resultTitle"></h1>
    <p id="resultText"></p>
    <button class="btn small" type="button" id="restart">Start over</button>
  </section>

</div>

<script>
(function () {
  var COLOURS = [
    { name: "Strawberry", body: "#ff7a9c", dark: "#d94a72" },
    { name: "Sunny", body: "#ffd04a", dark: "#d9a520" },
    { name: "Minty", body: "#5fd6ad", dark: "#2fa47e" },
    { name: "Grape", body: "#b48cff", dark: "#8458db" }
  ];
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var state = { from: "Sam", to: "Alex", note: "I like it when you laugh at my terrible jokes.", colour: 0, created: false, opened: false, answer: null, dodges: 0 };

  // ---------- little messenger character ----------
  function messenger(mood, c) {
    var col = COLOURS[c];
    var eyes, mouth, extra = "";
    if (mood === "happy") {
      eyes = '<g class="look"><path d="M44 58 q6-8 12 0" stroke="#3b1f2b" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M74 58 q6-8 12 0" stroke="#3b1f2b" stroke-width="4" fill="none" stroke-linecap="round"/></g>';
      mouth = '<path d="M52 72 q13 16 26 0 z" fill="#3b1f2b"/><path d="M58 78 q7 5 14 0" fill="#ff5a7a"/>';
      extra = '<g fill="#ff3d6e"><path d="M10 30 c-4-6 4-10 6-4 c2-6 10-2 6 4 l-6 7 z"/><path d="M112 22 c-3-5 3-8 5-3 c2-5 8-2 5 3 l-5 6 z"/></g>';
    } else if (mood === "sad") {
      eyes = '<g class="look"><ellipse cx="50" cy="58" rx="5" ry="6" fill="#3b1f2b"/><ellipse cx="80" cy="58" rx="5" ry="6" fill="#3b1f2b"/></g>';
      mouth = '<path d="M56 80 q9-7 18 0" stroke="#3b1f2b" stroke-width="4" fill="none" stroke-linecap="round"/>';
      extra = '<path d="M86 66 q3 7 0 10 q-3-3 0-10z" fill="#7fd0ff"/>';
    } else {
      eyes = '<g class="look"><g class="eye"><ellipse cx="50" cy="58" rx="6" ry="8" fill="#3b1f2b"/><circle cx="52" cy="55" r="2" fill="#fff"/></g><g class="eye"><ellipse cx="80" cy="58" rx="6" ry="8" fill="#3b1f2b"/><circle cx="82" cy="55" r="2" fill="#fff"/></g></g>';
      mouth = '<path d="M58 74 q7 7 14 0" stroke="#3b1f2b" stroke-width="4" fill="none" stroke-linecap="round"/>';
    }
    var anim = mood === "happy" ? "dance" : mood === "sad" ? "droop" : "bob";
    return '<svg viewBox="0 0 130 140" aria-hidden="true"><g class="squish"><g class="' + anim + '">' +
      '<ellipse cx="65" cy="132" rx="38" ry="6" fill="#3b1f2b" opacity=".12"/>' +
      '<path d="M24 120 q-6-46 16-80 q25-34 50 0 q22 34 16 80 q-41 10-82 0z" fill="' + col.body + '" stroke="#3b1f2b" stroke-width="4"/>' +
      '<path d="M58 22 q-4-12 6-14" stroke="#3b1f2b" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="66" cy="8" r="5" fill="' + col.dark + '" stroke="#3b1f2b" stroke-width="3"/>' +
      eyes + mouth +
      '<ellipse cx="38" cy="70" rx="7" ry="4" fill="#ff5a7a" opacity=".55"/><ellipse cx="92" cy="70" rx="7" ry="4" fill="#ff5a7a" opacity=".55"/>' +
      '<path d="M48 104 c-6-8 4-14 8-6 c4-8 14-2 8 6 l-8 9 z" fill="#ff3d6e" stroke="#3b1f2b" stroke-width="3" stroke-linejoin="round"/>' +
      extra + "</g></g></svg>";
  }

  // ---------- views ----------
  var views = { ask: "view-ask", crush: "view-crush", result: "view-result" };
  function show(name) {
    if ((name === "crush" || name === "result") && !state.created) {
      if (!readForm()) { name = "ask"; } else { state.created = true; renderAsk(); }
    }
    Object.keys(views).forEach(function (k) { document.getElementById(views[k]).hidden = k !== name; });
    document.querySelectorAll(".steps button").forEach(function (b) { b.setAttribute("aria-current", b.dataset.go === name ? "true" : "false"); });
    if (name === "crush") { state.opened = true; renderCrush(); }
    if (name === "result") renderResult();
    window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  }
  document.addEventListener("click", function (e) {
    var go = e.target.closest("[data-go]");
    if (go) show(go.dataset.go);
  });

  // ---------- 1. ask ----------
  var sw = document.getElementById("swatches");
  COLOURS.forEach(function (c, i) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "swatch"; b.style.background = c.body;
    b.setAttribute("role", "radio"); b.setAttribute("aria-label", c.name);
    b.addEventListener("click", function () { state.colour = i; renderAsk(); });
    sw.appendChild(b);
  });
  function readForm() {
    var f = document.getElementById("fromName").value.trim(), t = document.getElementById("toName").value.trim();
    var err = document.getElementById("askError");
    if (!f || !t) { err.textContent = !f ? "Add your name so they know who's asking." : "Add their name so the page can greet them."; return false; }
    err.textContent = "";
    state.from = f; state.to = t; state.note = document.getElementById("note").value.trim();
    return true;
  }
  function renderAsk() {
    document.getElementById("askChar").innerHTML = messenger("hopeful", state.colour);
    sw.querySelectorAll(".swatch").forEach(function (b, i) { b.setAttribute("aria-checked", i === state.colour ? "true" : "false"); });
    document.getElementById("askForm").hidden = state.created;
    document.getElementById("linkPanel").hidden = !state.created;
  }
  document.getElementById("askForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!readForm()) return;
    state.created = true; state.answer = null; state.opened = false; state.dodges = 0;
    renderAsk();
  });
  document.getElementById("copyBtn").addEventListener("click", function () {
    var btn = this, txt = document.getElementById("linkText").textContent;
    function done() { btn.textContent = "Copied!"; setTimeout(function () { btn.textContent = "Copy"; }, 1400); }
    try { navigator.clipboard.writeText(txt).then(done, function () { selectText(); }); } catch (_) { selectText(); }
    function selectText() { var r = document.createRange(); r.selectNodeContents(document.getElementById("linkText")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  });

  // ---------- 2. their page ----------
  var TEASES = ["", "Wait, really?", "Are you sure?", "Think about it…", "The Yes button looks lonely", "Okay, okay. You can press No."];
  var yesBtn = document.getElementById("yesBtn"), noBtn = document.getElementById("noBtn"), answers = document.getElementById("answers");
  var NO_LIMIT = 5; // after this many dodges, No stays put so they can really say no
  function renderCrush() {
    document.getElementById("crushKicker").textContent = state.from + " sent you a question";
    document.getElementById("crushBubble").textContent = "Psst… " + state.to + "!";
    var title = document.getElementById("crushTitle");
    title.textContent = "";
    title.append("Will you be ");
    var nm = document.createElement("span"); nm.className = "name"; nm.textContent = state.from + "'s";
    title.append(nm, " crush?");
    var note = document.getElementById("crushNote");
    note.hidden = !state.note; note.textContent = state.note ? "“" + state.note + "”" : "";
    var answered = state.answer !== null;
    document.getElementById("askPanel").hidden = answered;
    document.getElementById("afterPanel").hidden = !answered;
    document.getElementById("crushChar").innerHTML = messenger(state.answer === "yes" ? "happy" : state.answer === "no" ? "sad" : "hopeful", state.colour);
    if (!answered) resetButtons();
    else {
      document.getElementById("afterText").textContent = state.answer === "yes"
        ? "Yay! " + state.from + " is going to be so happy."
        : "That's okay. Thank you for being honest with " + state.from + ".";
      document.getElementById("seeSide").textContent = "See " + state.from + "'s side →";
    }
  }
  function resetButtons() {
    state.dodges = 0;
    yesBtn.style.transform = "scale(1)";
    noBtn.style.left = "58%"; noBtn.style.top = "46px"; noBtn.textContent = "No";
    document.getElementById("tease").textContent = "";
  }
  function dodge(e) {
    if (state.answer !== null || state.dodges >= NO_LIMIT) return;
    if (e && e.type === "pointerdown") e.preventDefault();
    state.dodges++;
    var w = answers.clientWidth - noBtn.offsetWidth, h = answers.clientHeight - noBtn.offsetHeight;
    var yb = yesBtn.getBoundingClientRect(), ab = answers.getBoundingClientRect(), x, y, tries = 0;
    do { // keep away from the Yes button
      x = Math.random() * w; y = Math.random() * h; tries++;
    } while (tries < 20 && x + ab.left < yb.right + 10 && x + ab.left + noBtn.offsetWidth > yb.left - 10 && y + ab.top < yb.bottom + 10 && y + ab.top + noBtn.offsetHeight > yb.top - 10);
    noBtn.style.left = x + "px"; noBtn.style.top = y + "px";
    yesBtn.style.transform = "scale(" + (1 + state.dodges * 0.12) + ")";
    document.getElementById("tease").textContent = TEASES[Math.min(state.dodges, TEASES.length - 1)];
    if (state.dodges >= NO_LIMIT) noBtn.textContent = "No, sorry";
  }
  noBtn.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") dodge(e); });
  noBtn.addEventListener("pointerdown", function (e) { if (state.dodges < NO_LIMIT) dodge(e); });
  noBtn.addEventListener("click", function (e) {
    if (state.dodges < NO_LIMIT) { e.preventDefault(); if (e.detail === 0) dodge(); return; } // keyboard press also dodges first
    answer("no");
  });
  yesBtn.addEventListener("click", function () { answer("yes"); });
  function answer(a) {
    state.answer = a;
    renderCrush();
    if (a === "yes") confetti();
  }

  // ---------- 3. your answer ----------
  function renderResult() {
    var chips = document.getElementById("chips");
    chips.textContent = "";
    [["Link made", true, "done"], [state.opened ? "They opened it" : "Not opened yet", state.opened, "done"],
     [state.answer === "yes" ? "They said yes" : state.answer === "no" ? "They said no" : "Waiting for answer", state.answer !== null, state.answer === "yes" ? "yes" : "no"]]
      .forEach(function (c) { var s = document.createElement("span"); s.className = "chip" + (c[1] ? " " + c[2] : " pulse"); s.textContent = c[0]; chips.appendChild(s); });
    var title = document.getElementById("resultTitle"), text = document.getElementById("resultText");
    if (state.answer === "yes") {
      document.getElementById("resultChar").innerHTML = messenger("happy", state.colour);
      title.textContent = state.to + " said YES!";
      text.textContent = "Go say hi. Maybe bring snacks.";
      confetti();
    } else if (state.answer === "no") {
      document.getElementById("resultChar").innerHTML = messenger("sad", state.colour);
      title.textContent = state.to + " said no this time";
      text.textContent = "It took courage to ask, and that's something to be proud of. Be kind to yourself today.";
    } else {
      document.getElementById("resultChar").innerHTML = messenger("hopeful", state.colour);
      title.textContent = "Waiting for " + state.to + "…";
      text.textContent = state.opened ? "They've seen it. Fingers crossed!" : "Send them your link. This page updates when they answer.";
    }
  }
  document.getElementById("restart").addEventListener("click", function () {
    state.created = false; state.answer = null; state.opened = false;
    renderAsk(); show("ask");
  });

  // ---------- confetti ----------
  var cv = document.getElementById("confetti"), ctx = cv.getContext("2d"), parts = [], raf = 0;
  function confetti() {
    if (reduceMotion) return;
    cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    var cols = ["#ff3d6e", "#ffcf3f", "#4fcfa3", "#b48cff", "#ff7a9c"];
    for (var i = 0; i < 140; i++) parts.push({
      x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4,
      vx: (Math.random() - .5) * 4 * devicePixelRatio, vy: (2 + Math.random() * 4) * devicePixelRatio,
      r: (5 + Math.random() * 7) * devicePixelRatio, a: Math.random() * 6, va: (Math.random() - .5) * .2,
      c: cols[i % cols.length], heart: Math.random() < .45
    });
    if (!raf) raf = requestAnimationFrame(step);
  }
  function heart(r) { ctx.beginPath(); ctx.moveTo(0, r * .35); ctx.bezierCurveTo(-r, -r * .4, -r * .4, -r, 0, -r * .35); ctx.bezierCurveTo(r * .4, -r, r, -r * .4, 0, r * .35); ctx.fill(); }
  function step() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(function (p) { return p.y < cv.height + 40; });
    parts.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; p.vy += .05 * devicePixelRatio; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      if (p.heart) heart(p.r); else ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      ctx.restore();
    });
    raf = parts.length ? requestAnimationFrame(step) : 0;
    if (!raf) ctx.clearRect(0, 0, cv.width, cv.height);
  }

  // ---------- interactive messenger: follow, drag, poke ----------
  var HEART = '<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#ff3d6e" stroke="#3b1f2b" stroke-width="2"/></svg>';
  var pointer = null, buddies = [];
  window.addEventListener("pointermove", function (e) { pointer = { x: e.clientX, y: e.clientY }; }, { passive: true });
  function clamp(v, m) { return Math.max(-m, Math.min(m, v)); }
  function buddy(el) {
    var b = { el: el, x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, drag: false, moved: false, sx: 0, sy: 0, ox: 0, oy: 0 };
    el.addEventListener("pointerdown", function (e) {
      b.drag = true; b.moved = false; b.sx = e.clientX; b.sy = e.clientY; b.ox = b.x; b.oy = b.y;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      el.classList.add("held");
    });
    el.addEventListener("pointermove", function (e) {
      if (!b.drag) return;
      var dx = e.clientX - b.sx, dy = e.clientY - b.sy;
      if (Math.abs(dx) + Math.abs(dy) > 6) b.moved = true;
      b.tx = clamp(b.ox + dx, 140); b.ty = clamp(b.oy + dy, 120);
    });
    function release() {
      if (!b.drag) return;
      b.drag = false; el.classList.remove("held");
      if (!b.moved) poke(b);
    }
    el.addEventListener("pointerup", release);
    el.addEventListener("pointercancel", release);
    buddies.push(b);
  }
  function poke(b) {
    b.el.classList.remove("poked"); void b.el.offsetWidth; b.el.classList.add("poked");
    if (reduceMotion) return;
    var h = document.createElement("span");
    h.className = "pop"; h.innerHTML = HEART;
    h.style.setProperty("--dx", (Math.random() * 60 - 30).toFixed(0) + "px");
    b.el.appendChild(h);
    setTimeout(function () { h.remove(); }, 1000);
    b.vy -= 6; // little hop
  }
  function tick() {
    buddies.forEach(function (b) {
      if (!b.el.offsetParent) return; // hidden screen
      var r = b.el.getBoundingClientRect();
      var hx = r.left + r.width / 2 - b.x, hy = r.top + r.height / 2 - b.y; // home centre
      var lookX = 0, lookY = 0;
      if (pointer) {
        var dx = pointer.x - hx, dy = pointer.y - hy, d = Math.hypot(dx, dy) || 1;
        lookX = dx / d; lookY = dy / d;
        if (!b.drag) {
          var pull = reduceMotion ? 0 : Math.min(d, 320) / 320 * 34; // drift a little toward the cursor
          b.tx = lookX * pull; b.ty = lookY * pull * 0.6;
        }
      } else if (!b.drag) { b.tx = 0; b.ty = 0; }
      var k = b.drag ? 0.3 : 0.035; // dragging is snappy, following is slow and floaty
      b.vx = (b.vx + (b.tx - b.x) * k) * (b.drag ? 0.6 : 0.88);
      b.vy = (b.vy + (b.ty - b.y) * k) * (b.drag ? 0.6 : 0.88);
      b.x += b.vx; b.y += b.vy;
      b.el.style.transform = "translate(" + b.x.toFixed(1) + "px," + b.y.toFixed(1) + "px) rotate(" + clamp(b.vx * 1.6, 14).toFixed(1) + "deg)";
      var look = b.el.querySelector(".look");
      if (look) look.setAttribute("transform", "translate(" + (lookX * 3.5).toFixed(1) + " " + (lookY * 3).toFixed(1) + ")");
    });
    requestAnimationFrame(tick);
  }
  ["askChar", "crushChar", "resultChar"].forEach(function (id) { buddy(document.getElementById(id)); });
  requestAnimationFrame(tick);

  renderAsk();
})();
</script>
